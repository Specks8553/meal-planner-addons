# Meal Planner (Test) — the add-on store entry (A1 step 13). This file is the source; the release
# script copies it, with DOCS.md, CHANGELOG.md and icon.png, into the public description
# repository Specks8553/meal-planner-addons (A1-C2: descriptions public, program private).
name: "Meal Planner (Test)"
description: "Testinstallation von Meal Planner 0.2 – nicht für den Haushaltsalltag"
version: "0.2.8"
slug: meal_planner_test
url: "https://github.com/Specks8553/meal-planner-addons"
# Ready-made image built in GitHub (P4-7.5, R6), private; HA downloads it with the read-only key.
image: "ghcr.io/specks8553/meal-planner-{arch}"
arch:
  - aarch64
init: false
startup: application
boot: auto
# The dashboard door: HA ingress only (Companion-app panel, later the dashboard tile).
ingress: true
ingress_port: 8099
panel_icon: mdi:basket-outline
panel_title: "Meal Planner (Test)"
# The app door listens on 8100 inside HA's network for the tunnel add-on; no host port is opened.
watchdog: "http://[HOST]:[PORT:8099]/api/health"
# SQLite stays consistent: the add-on pauses for the length of a backup.
backup: cold
map:
  # Its own folder (/config inside, addon_configs on the share): Rückmeldungen and Fehlerberichte.
  - type: app_config
    read_only: false
options:
  admin_users: []
  simulate_cookidoo_failure: false
schema:
  # A1-C5 fallback: HA user names allowed to remove phones. Reading HA's user list would need the
  # add-on's admin role (full Supervisor control), which it is not given.
  admin_users:
    - str
  # A2-C2: the Cookidoo login ("Zugangsdaten werden in Home Assistant verwaltet"). Empty: the test
  # add-on uses the recorded test pool ("simuliert", A2-C1).
  cookidoo_email: "email?"
  cookidoo_password: "password?"
  # Test add-on only: every Cookidoo read fails, to try "a failed read keeps the last good copy".
  simulate_cookidoo_failure: bool
  # How the PC reaches the share for "Rezeptordner" (by IP, L6), e.g. 192.168.178.55.
  share_host: "str?"
